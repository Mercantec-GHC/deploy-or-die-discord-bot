name: deploy-or-die-discord-bot

services:
    cloudflared:
        image: cloudflare/cloudflared:latest
        container_name: cloudflared
        restart: unless-stopped
        command: tunnel --no-autoupdate run
        environment:
        - TUNNEL_TOKEN=${TUNNEL_TOKEN}

    nginx:
        image: nginx:alpine
        container_name: nginx
        restart: unless-stopped
        network_mode: host
        volumes:
        - /nginx-site/html:/usr/share/nginx/html:ro
        - /nginx-site/default.conf:/etc/nginx/conf.d/default.conf:ro
        extra_hosts:
        - "host.docker.internal:host-gateway"

    discord-bot:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        env_file:
            - path: .env
        ports:
            - "3000:3000"
