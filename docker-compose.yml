name: deploy-or-die-discord-bot

services:
    nginx:
        image: nginx:alpine
        container_name: nginx
        restart: unless-stopped
        network_mode: host
        volumes:
        - /nginx-site/html:/usr/share/nginx/html:ro
        - /nginx-site/default.conf:/etc/nginx/conf.d/default.conf:ro
        
    discord-bot:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        env_file:
            - path: .env
        ports:
            - "3000:3000"
